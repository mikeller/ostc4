name: Build the OSTC 4/5 Firmware

permissions:
  contents: write

on:
  push:
    branches:
    - development
  pull_request:
  workflow_dispatch:

env:
  BUILD_TOOLS_DIR: ${{ github.workspace }}/tools

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: get container ready for build
      run: |
        sudo apt-get -y update

    - name: checkout sources
      uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false

    - name: get ARM toolchain version
      id: set_variables
      run: |
        ARM_TOOLCHAIN_VERSION=$(make arm_tools_version)
        echo "arm_toolchain_version=${ARM_TOOLCHAIN_VERSION}" >> $GITHUB_OUTPUT

    - name: load the arm toolchain from cache
      if: github.event_name != 'push'
      id: cache_toolchain
      uses: actions/cache/restore@v6.1.0
      with:
        path: ${{ env.BUILD_TOOLS_DIR }}/
        key: arm_toolchain-${{ steps.set_variables.outputs.arm_toolchain_version }}

    - name: install toolchain
      if: steps.cache_toolchain.outputs.cache-hit != 'true'
      env:
        BUILD_TOOLS_DIR: ${{ env.BUILD_TOOLS_DIR }}
      run: |
        make arm_tools_install

    - name: save the arm toolchain to cache
      if: github.event_name == 'push'
      uses: actions/cache/save@v6.1.0
      with:
        path: ${{ env.BUILD_TOOLS_DIR }}/
        key: arm_toolchain-${{ steps.set_variables.outputs.arm_toolchain_version }}

    - name: generate the version
      id: generate_version
      env:
        PULL_REQUEST_BRANCH: ${{ github.event.pull_request.head.ref }}
        PULL_REQUEST_NUMBER: ${{ github.event.number }}
        PULL_REQUEST_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        make packer
        VERSION=$(make print_version)
        SHORT_SHA=$(git rev-parse --short HEAD)
        if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
          SHORT_SHA=$(git rev-parse --short $PULL_REQUEST_SHA)
          NAME="${PULL_REQUEST_NUMBER}-$(echo "${PULL_REQUEST_BRANCH}" | sed 's@[/_]@-@g;s/[^.a-zA-Z0-9-]//g')"
        else
          NAME="$(date +%Y%m%d)"
        fi
        NAME="${VERSION}-${NAME}-${SHORT_SHA}"
        echo "name=$NAME" >> $GITHUB_OUTPUT

    - name: build the full image
      env:
        BUILD_TOOLS_DIR: ${{ env.BUILD_TOOLS_DIR }}
      run: |
        make NO_DATE=1 all

    - name: build the RTE image
      env:
        BUILD_TOOLS_DIR: ${{ env.BUILD_TOOLS_DIR }}
      run: |
        make NO_DATE=1 rte

    - name: build the fontpack image
      env:
        BUILD_TOOLS_DIR: ${{ env.BUILD_TOOLS_DIR }}
      run: |
        make NO_DATE=1 fontpack

    - name: build the firmware image
      env:
        BUILD_TOOLS_DIR: ${{ env.BUILD_TOOLS_DIR }}
      run: |
        make NO_DATE=1 firmware

    - name: PR artifacts
      if: github.event_name == 'pull_request'
      uses: actions/upload-artifact@v7.0.2
      with:
        name: OSTC4_update-${{ steps.generate_version.outputs.name }}
        path: Release/OSTC4update_*.bin

    - name: Push release
      if: github.event_name == 'push'
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_TAG: ${{ steps.generate_version.outputs.name }}
      run: |
        if lookup_result=$(gh release view "$RELEASE_TAG" --json id 2>&1); then
          gh release upload "$RELEASE_TAG" Release/OSTC4update_*.bin --clobber
        elif [ "$lookup_result" = 'release not found' ]; then
          gh release create "$RELEASE_TAG" Release/OSTC4update_*.bin \
            --generate-notes --target "$GITHUB_SHA"
        else
          printf '%s\n' "$lookup_result" >&2
          exit 1
        fi

    - name: build the bootloader
      env:
        BUILD_TOOLS_DIR: ${{ env.BUILD_TOOLS_DIR }}
      run: |
        make NO_DATE=1 bootloader
